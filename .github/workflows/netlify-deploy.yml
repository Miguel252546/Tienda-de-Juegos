name: Deploy to Netlify

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ 69027445b33d7900785431c1 }}
        run: |
          # Install netlify CLI and deploy the built site (dist)
          npm install -g netlify-cli
          netlify deploy --dir=dist --prod --site=$NETLIFY_SITE_ID --message "Deploy from GitHub Actions"
