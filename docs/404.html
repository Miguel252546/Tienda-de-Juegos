<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda de Juegos</title>
    <script>
      // Redirige cualquier 404 al index.html para que React Router maneje la navegación
      var path = decodeURIComponent(window.location.pathname);
      if (!path.includes('/Tienda-de-Juegos/')) {
        window.location.href = '/Tienda-de-Juegos/' + path.split('/').slice(2).join('/');
      } else {
        window.location.href = '/Tienda-de-Juegos/';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
